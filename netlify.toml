[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 世界书牌面的金线框素材（/arcana/*）。Netlify 默认给 public 静态资源发
# must-revalidate＝每次冷启动都重下、进门必闪一下；这里改成一年长缓存
# （内容是构建期固定的，不会变）。字体已全改系统字，不再需要 /fonts 缓存。
[[headers]]
  for = "/arcana/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
